name: ansnew-cloud

# Shared log rotation. Without this the Docker json-file driver grows without
# bound — the app also writes its own log inside the data volume, so both need
# a cap. See docs/DEPLOY.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ansnew/nginx
    ports:
      # The app itself. Published for a local/dev instance; in production keep
      # it closed in the firewall (only 80/443 should be reachable).
      - "${HTTP_PORT:-8080}:8080"
      # Public HTTP: serves the ACME challenge and 301-redirects to HTTPS.
      - "${PUBLIC_HTTP_PORT:-80}:8082"
      # Public HTTPS (TLS terminated by nginx, proxied to the app listener).
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      # TLS material, kept OUTSIDE the project (and outside OneDrive) so the
      # private key is never cloud-synced. See scripts/make-cert.sh.
      - ${CERTS_HOST_PATH:-./certs}:/etc/nginx/certs:ro
      # certbot's HTTP-01 challenge directory (read-only into nginx).
      - ${ACME_WEBROOT_HOST_PATH:-./acme-webroot}:/var/www/acme:ro
    depends_on:
      php:
        condition: service_healthy
      ws:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 256
    networks: [ansnew]

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ansnew/php
    env_file: .env
    environment:
      APP_ENV: production
      APP_ROLE: api
    volumes:
      - data_volume:/var/www/data
      - storage_volume:/srv/storage
      - ${STORAGE_HOST_PATH:-./storage-root}:/srv/storage/local
      # DB + encryption-key backup output (ansnew:backup). Kept outside the data
      # volume so `docker compose down -v` cannot take the backups with it.
      - ${BACKUP_HOST_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);' && test -w /var/www/data"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    networks: [ansnew]

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ansnew/php
    env_file: .env
    environment:
      APP_ENV: production
      APP_ROLE: worker
    entrypoint: ["/entrypoint.sh", "php", "/var/www/app/bin/worker.php"]
    volumes:
      - data_volume:/var/www/data
      - storage_volume:/srv/storage
      - ${STORAGE_HOST_PATH:-./storage-root}:/srv/storage/local
      - ${BACKUP_HOST_PATH:-./backups}:/backups
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    networks: [ansnew]

  ws:
    build:
      context: .
      dockerfile: docker/ws/Dockerfile
    image: ansnew/ws
    env_file: .env
    environment:
      APP_ROLE: ws
      WS_PORT: 3001
      ANSNEW_DATA_DIR: /var/www/data
      PHP_API_URL: http://nginx:8080
    volumes:
      - data_volume:/var/www/data:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 256
    networks: [ansnew]

  # --- NAS (SMB) option -----------------------------------------------------
  # Opt-in network file share. Bring it up with `docker compose --profile nas up -d`
  # (or set COMPOSE_PROFILES=nas in .env). It exposes the file manager's _inbox
  # folder as a writable SMB share (TCP 445) so Windows "Map Network Drive" and
  # mobile SMB apps can drop files straight in; nas-watch then imports them into
  # the file manager at a rate-limited queue (see NAS_INGEST_MBPS).
  nas:
    build:
      context: .
      dockerfile: docker/nas/Dockerfile
    image: ansnew/nas
    env_file: .env
    environment:
      NAS_SHARE_NAME: ${NAS_SHARE_NAME:-ansnew}
      NAS_USER: ${NAS_USER:-ansnew}
      NAS_PASS: ${NAS_PASS:-change-me}
    volumes:
      - ${STORAGE_HOST_PATH:-./storage-root}:/srv/storage/local
    ports:
      - "${NAS_PORT:-445}:445"
    profiles: ["nas"]
    restart: unless-stopped
    networks: [ansnew]

  # Watches _inbox and imports dropped files (encrypt-at-rest + 50 MB/s cap).
  nas-watch:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ansnew/php
    env_file: .env
    environment:
      APP_ENV: production
      APP_ROLE: nas-watch
    entrypoint: ["/entrypoint.sh", "php", "/var/www/app/bin/nas-watch.php"]
    volumes:
      - data_volume:/var/www/data
      - ${STORAGE_HOST_PATH:-./storage-root}:/srv/storage/local
    profiles: ["nas"]
    restart: unless-stopped
    networks: [ansnew]

  db:
    image: mariadb:11
    profiles: ["mysql"]
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [ansnew]

volumes:
  data_volume:
  db_volume:
  storage_volume:

networks:
  ansnew:
    driver: bridge
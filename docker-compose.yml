name: ansnew-cloud

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ansnew/nginx
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      php:
        condition: service_healthy
      ws:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks: [ansnew]

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ansnew/php
    env_file: .env
    environment:
      APP_ENV: production
      APP_ROLE: api
    volumes:
      - data_volume:/var/www/data
      - storage_volume:/srv/storage
      - ${STORAGE_HOST_PATH:-./storage-root}:/srv/storage/local
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);' && test -w /var/www/data"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [ansnew]

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ansnew/php
    env_file: .env
    environment:
      APP_ENV: production
      APP_ROLE: worker
    entrypoint: ["/entrypoint.sh", "php", "/var/www/app/bin/worker.php"]
    volumes:
      - data_volume:/var/www/data
      - storage_volume:/srv/storage
      - ${STORAGE_HOST_PATH:-./storage-root}:/srv/storage/local
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    networks: [ansnew]

  ws:
    build:
      context: .
      dockerfile: docker/ws/Dockerfile
    image: ansnew/ws
    env_file: .env
    environment:
      APP_ROLE: ws
      WS_PORT: 3001
      ANSNEW_DATA_DIR: /var/www/data
      PHP_API_URL: http://nginx:8080
    volumes:
      - data_volume:/var/www/data:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [ansnew]

  db:
    image: mariadb:11
    profiles: ["mysql"]
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [ansnew]

volumes:
  data_volume:
  db_volume:
  storage_volume:

networks:
  ansnew:
    driver: bridge
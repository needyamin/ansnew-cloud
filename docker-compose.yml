name: ansnew-cloud

# Shared log rotation. Without this the Docker json-file driver grows without
# bound — the app also writes its own log inside the data volume, so both need
# a cap. See docs/DEPLOY.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ${IMAGE_NGINX:-ansnew/nginx}
    ports:
      # The app itself. Published for a local/dev instance; in production keep
      # it closed in the firewall (only 80/443 should be reachable).
      - "${HTTP_PORT:-8080}:8080"
      # Public HTTP: serves the ACME challenge and 301-redirects to HTTPS.
      - "${PUBLIC_HTTP_PORT:-80}:8082"
      # Public HTTPS (TLS terminated by nginx, proxied to the app listener).
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      # The site config, mounted READ-ONLY as the source of truth. It is copied
      # to /etc/nginx/conf.d/default.conf at startup by
      # docker/nginx/40-ansnew-tls.sh, which is what lets the TLS certificate
      # paths be redirected to a generated placeholder when no certificate is
      # mounted — otherwise nginx would refuse to start at all.
      - ./docker/nginx/default.conf:/etc/nginx/ansnew/default.conf:ro
      # TLS material, kept OUTSIDE the project (and outside OneDrive) so the
      # private key is never cloud-synced. Read-only on purpose: the container
      # must not be able to rewrite the key on the host. See scripts/make-cert.sh.
      - ${CERTS_HOST_PATH:-./certs}:/etc/nginx/certs:ro
      # certbot's HTTP-01 challenge directory (read-only into nginx).
      - ${ACME_WEBROOT_HOST_PATH:-./acme-webroot}:/var/www/acme:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 256
    networks: [ansnew]

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ${IMAGE_PHP:-ansnew/php}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_ROLE: api
    volumes:
      - data_volume:/var/www/data
      - storage_volume:/srv/storage
      - ${STORAGE_HOST_PATH:-./storage-root}:/srv/storage/local
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);' && test -w /var/www/data"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    networks: [ansnew]

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ${IMAGE_PHP:-ansnew/php}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_ROLE: worker
    entrypoint: ["/entrypoint.sh", "php", "/var/www/app/bin/worker.php"]
    volumes:
      - data_volume:/var/www/data
      - storage_volume:/srv/storage
      - ${STORAGE_HOST_PATH:-./storage-root}:/srv/storage/local
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    networks: [ansnew]

volumes:
  data_volume:
  storage_volume:

networks:
  ansnew:
    driver: bridge

# ANSNEW CLOUD nginx site: SPA + FastCGI to php-fpm + WS upgrade proxy.
# Runs as the unprivileged nginx user (uid 101), so it never binds a privileged
# port itself — the host maps 80/443 onto these listeners (see docker-compose).
#
# Three listeners, so there is exactly ONE copy of the routing rules:
#   8080  the app       -> real config (FastCGI / SPA / assets). Published for a
#                         local/dev instance; firewall it off in production.
#   8082  public HTTP   -> ACME challenge + redirect to HTTPS (host 80 in prod)
#   8443  public HTTPS  -> TLS termination, proxies to 8080
#
# The redirect lives on its OWN port rather than sharing the app listener:
# a blanket redirect there would loop against the TLS proxy, and would also
# break a local instance that is reached over plain http://localhost.

# WebSocket upgrade passthrough (used by the app listener and the TLS proxy).
map $http_upgrade $ansnew_connection_upgrade {
    default upgrade;
    ''      close;
}

# --- 8082: public HTTP — ACME + redirect -----------------------------------
server {
    listen 8082;
    server_name _;

    # certbot's HTTP-01 challenge must be answerable over plain HTTP. This is
    # matched first (^~), so it is never redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        access_log off;
    }

    # Health probe (must not redirect).
    location = /healthz {
        root /usr/share/nginx/html;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 8080: the app (reached directly, or via the TLS listener) --------------
server {
    listen 8080;
    server_name _;

    # Only the TLS listener (loopback) may set the client IP. A direct request
    # to this port cannot spoof it — its X-Forwarded-For is ignored, so
    # $remote_addr stays the real peer. That value is what gets passed to PHP
    # below, so rate limiting, login lockout and the audit log key on a
    # trustworthy address even if this port is accidentally exposed.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    root /var/www/public;
    index index.html;

    # --- security headers -------------------------------------------------
    # NOTE: `add_header` inside a location REPLACES every inherited add_header
    # from the server block, so any location that sets one must repeat the set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'self' blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 2200M;
    client_body_timeout 300s;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # --- compression ------------------------------------------------------
    # Directory listings and the SPA bundle are text and were previously sent
    # uncompressed. image/* and application/octet-stream are deliberately
    # excluded: already-compressed, and compressing downloads breaks
    # Content-Length / Range handling.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # Never serve anything from the runtime data dir or dotfiles.
    location ^~ /data/           { return 404; }
    location ~ /\.               { return 404; }

    # Static SPA assets. `expires -1` revalidates (304s are cheap) instead of
    # caching for an hour, so a rebuilt frontend is never shadowed by stale JS.
    location /assets/ {
        expires -1;
        # Full header set repeated: a location add_header replaces the
        # server-level ones, and CSP was the one that used to go missing here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'self' blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location = /healthz {
        root /usr/share/nginx/html;
        access_log off;
    }

    # WebSocket upgrade → Node ws service.
    location /ws {
        proxy_pass http://ws:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API → php-fpm. Single front controller handles everything.
    #
    # Deliberately NO `try_files` here. try_files resolves by issuing an internal
    # redirect, and nginx discards the already-buffered request body when it does
    # so. Every request that carries a body on a method nginx does not re-read it
    # for then stalls and finally fails with an empty 400 — which is why
    # `DELETE /api/favorites` (the unfavourite action) never worked from a
    # browser while working fine from curl. Nothing under /api is static, so the
    # front controller can be addressed directly and the body survives intact.
    location /api {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        # $remote_addr here is post-realip — the true client. Passing that
        # instead of the raw header means a client-supplied X-Forwarded-For can
        # never reach PHP and forge the address lockouts key on.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        # Stream media (video/audio previews and downloads) straight through
        # instead of buffering the whole response to disk first: buffering made
        # playback start late and made seeking wait for a fresh full buffer.
        # HTTP Range requests still pass through untouched.
        fastcgi_buffering off;
        fastcgi_hide_header X-Powered-By;
    }

    # Public share links → php-fpm. GET only and no session: the token IS the
    # credential. Routed directly (no try_files) for the same reason as /api, and
    # because a share link must reach PHP rather than the SPA shell — the SPA has
    # no idea what a token is.
    location /s/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
        fastcgi_hide_header X-Powered-By;
    }

    # SPA + any non-API path → static index.html (no PHP fallback for UI routes).
    # `expires -1` revalidates (it does NOT clobber the inherited add_header
    # security headers, unlike an add_header here would).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_read_timeout 300s;
        fastcgi_hide_header X-Powered-By;
    }
}

# --- 8443: public HTTPS (TLS termination) -----------------------------------
# Terminates TLS and proxies to the app listener, so routing lives in one place.
# The certificate is mounted read-only from outside the image
# (${CERTS_HOST_PATH}) so it survives rebuilds.
#
# Self-signed by default (browser warning). Issue a real certificate for the
# domain with scripts/init-letsencrypt.sh and renew via scripts/renew-cert.sh.
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # HSTS. Start low (300s) while you validate TLS, then raise to 31536000 —
    # it is sticky: browsers will refuse plain HTTP for max-age once seen.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    # Must match the app listener or large uploads over HTTPS fail with 413.
    client_max_body_size 2200M;
    client_body_timeout  300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite (not append): $proxy_add_x_forwarded_for would keep a
        # client-supplied X-Forwarded-For as the first hop, letting anyone spoof
        # the IP that rate limiting, login lockout and the audit log key on.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket upgrade (the realtime channel).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $ansnew_connection_upgrade;
        # Stream media instead of buffering whole responses.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

; ANSNEW CLOUD all-in-one image — process supervision.
;
; One container runs all three roles of the classic deployment (nginx,
; php-fpm, job worker) so a single `docker run` brings up a working instance.
; The container runs as www-data (uid 82) END TO END — supervisord included —
; so nothing here regains the root privileges the split images never had.
;
; Priorities start php-fpm before nginx (nginx answers 502 for the few
; seconds until the pool is up — the same window the split deployment has
; between depends_on: service_healthy), and the worker last. On `docker stop`
; supervisord stops them in reverse order.
;
; All output streams to the container's stdout/stderr; nothing is written to
; files inside the container except under the writable data volume.

[supervisord]
nodaemon=true
; In the foreground supervisord logs to stderr regardless of logfile, so a
; /dev/stdout logfile would double every line into the container log. /dev/null
; silences the file handler; stderr is the single stream Docker captures.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- php-fpm (the REST API) -------------------------------------------------
; -F keeps the master in the foreground. The pool runs as the master's user
; (www-data) exactly as it does in the split deployment's php container.
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=10
autorestart=unexpected
exitcodes=0,2
startsecs=5
stopsignal=INT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- nginx (SPA + TLS + ACME challenge) -------------------------------------
; -e: nginx tries the compiled-in error log path (/var/lib/nginx/logs/, root
; owned) BEFORE parsing the config; pointing it at stderr from the command
; line avoids a permission-denied alert on every start.
[program:nginx]
command=nginx -e /dev/stderr -g "daemon off;"
priority=20
autorestart=unexpected
exitcodes=0
startsecs=5
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- job worker (background jobs: zip/extract/copy/move/delete/usage) -------
; The worker loop never returns in normal operation, so restart it whatever
; the exit code was — a dead worker means a stack that looks healthy (the API
; serves fine) but silently stops archiving, sweeping trash and finishing jobs.
[program:worker]
command=php /var/www/app/bin/worker.php
priority=30
autorestart=true
startsecs=10
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=APP_ROLE="worker"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

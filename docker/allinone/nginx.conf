# ANSNEW CLOUD all-in-one image — main nginx config.
#
# A fresh main config instead of the stock alpine nginx.conf, because the whole
# container runs as www-data (uid 82, never root): nginx must not touch any
# root-owned path. The pid file and every temp dir therefore live under /tmp
# (www-data-writable), and the site config it rewrites at startup
# (40-ansnew-tls.sh -> conf.d/ansnew.conf) is in the chown'd /etc/nginx tree.
#
# The site itself (servers on 8080/8082/8443) comes from
# /etc/nginx/conf.d/*.conf, generated at startup from the baked template
# /etc/nginx/ansnew/default.conf — the SAME file the split nginx image ships.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Everything to the container log; Docker's json-file caps rotate it.
    access_log /dev/stdout;

    # Large uploads stream through client_body_temp — this must be a
    # www-data-writable path, not the compiled-in /var/lib/nginx default.
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;

    include /etc/nginx/conf.d/*.conf;
}

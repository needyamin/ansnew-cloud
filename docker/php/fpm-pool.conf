; ANSNEW CLOUD php-fpm pool.
;
; The stock image ships no pool config, so php-fpm fell back to its built-in
; defaults — most importantly pm.max_children = 5. Because media previews and
; downloads stream straight through (fastcgi_buffering off in nginx), each one
; holds a worker for the whole transfer, so five was easy to exhaust and the
; API would then time out for everyone else.
;
; SIZING: pm.max_children × the PEAK memory of one request should fit inside the
; container's mem_limit (docker-compose.yml, currently 2g). Requests here are
; mostly streaming, so typical usage is tens of MB — the 512M memory_limit is a
; ceiling, not a reservation. On a small VPS lower both together.

[www]
; MUST stay "no". The application reads its entire configuration from the
; environment (Config::i() calls getenv()); clearing it would silently reset
; every setting to its default value.
clear_env = no

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers periodically — cheap insurance against a slow leak.
pm.max_requests = 500
pm.process_idle_timeout = 10s

; Hard ceiling on a single request; keep >= nginx's fastcgi_read_timeout (300s).
request_terminate_timeout = 300s

; Forward worker stdout/stderr to the FPM master so it reaches the container
; log (where Docker rotates it) instead of being discarded.
catch_workers_output = yes

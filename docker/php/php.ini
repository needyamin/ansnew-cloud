; ANSNEW CLOUD hardened production PHP settings

[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/data/logs/php-error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000

; Sessions — hardened
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_only_cookies = 1
session.gc_maxlifetime = 43200
session.save_path = "/var/www/data/sessions"

; Uploads — files live outside the web root; nginx never serves uploads
file_uploads = On
upload_max_filesize = 2048M
post_max_size = 2200M
max_file_uploads = 50
upload_tmp_dir = /var/www/data/tmp

; Never allow user-uploaded code to run.
; NOTE: proc_open is intentionally NOT disabled — the SMB adapter needs it to run
; smbclient. Safety there comes from per-argument escapeshellarg() + an auth file,
; never from shell string interpolation (see src/App/Storage/Adapters/SmbAdapter.php).
allow_url_include = Off
allow_url_fopen = Off
disable_functions = exec,passthru,shell_exec,system,popen,parse_ini_file,show_source

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30
opcache.max_accelerated_files = 16000
opcache.memory_consumption = 192
